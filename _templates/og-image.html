<!DOCTYPE html>
<!--
  Blog yazısı için Open Graph görseli şablonu (1200×630). Yayınlanmaz: alt çizgili klasörler GitHub Pages'te atlanır.
  Dev-only OG card template (1200×630). Not deployed.

  Kullanım / Usage:
    1. Serve the repo root:   python3 -m http.server 8123
    2. Open (or headless-screenshot at exactly 1200×630):
       http://localhost:8123/_templates/og-image.html?title=Who%20are%20These%20Agents%3F&date=JULY%2011%2C%202026
    3. Save as assets/images/og/<slug>.jpg (JPEG, ~60–80 KB) and point the post's
       og:image / twitter:image / JSON-LD "image" at it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG image template</title>
<style>
@font-face {
  font-family: 'Anton';
  font-weight: 400;
  src: url("../assets/fonts/anton-400-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Anton';
  font-weight: 400;
  src: url("../assets/fonts/anton-400-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Archivo';
  font-weight: 400 800;
  src: url("../assets/fonts/archivo-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Archivo';
  font-weight: 400 800;
  src: url("../assets/fonts/archivo-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
*{ box-sizing: border-box; }
html, body{ margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body{
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 72px 80px 64px;
  background: radial-gradient(60% 70% at 50% 55%, #2A241C 0%, transparent 70%), #14110E;
  font-family: 'Archivo', sans-serif;
}
.kicker{
  margin: 0;
  color: rgba(255,255,255,.72);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
}
.title{
  margin: 0;
  max-width: 1040px;
  color: #E9B44C;
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  font-size: 132px;
  line-height: .95;
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.foot{
  display: flex;
  justify-content: space-between;
  margin: 0;
  color: #E9B44C;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.foot span:first-child{ color: rgba(255,255,255,.8); }
</style>
</head>
<body>
  <p class="kicker" id="kicker">Blog</p>
  <h1 class="title" id="title">Title</h1>
  <p class="foot"><span>Barış Akıntı</span><span>barishizm.eu</span></p>
<script>
  var q = new URLSearchParams(location.search);
  var title = q.get('title') || 'Title';
  var date = q.get('date');
  document.getElementById('title').textContent = title;
  document.getElementById('kicker').textContent = date ? 'Blog · ' + date : 'Blog';
  if (title.length > 26) document.getElementById('title').style.fontSize = '112px';
</script>
</body>
</html>
